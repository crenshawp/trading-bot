[project]
name = "trading-bot"
version = "0.1.0"
description = "Python algorithmic trading alert bot — scans stock/crypto watchlists and sends Discord/Pushover signals."
authors = [
    { name = "unkownuccr", email = "drigsstore1@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "yfinance",
    "pandas",
    "numpy",
    "requests",
    "schedule",
    "python-dotenv",
    "keyring",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

# Flat package layout: trading_bot/ lives at the project root, not under src/.
[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.py"]
# Legacy backtesters still excluded — will be migrated in a later cleanup phase.
# The old tradingbot.py was migrated into trading_bot/scanner.py in Phase 1.2
# and is now a 3-line shim that ruff handles trivially.
#   backtest.py    — legacy backtester; unused imports, E701, missing newline
#   backtest2.py   — legacy crypto backtester; same class of legacy issues
extend-exclude = [".venv", "build", "dist", "backtest.py", "backtest2.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

# Legacy root-level files are not held to strict typing yet (Phase 1.2).
[[tool.mypy.overrides]]
module = "*"
ignore_errors = true

# New code in trading_bot/ IS held to strict typing.
[[tool.mypy.overrides]]
module = "trading_bot.*"
ignore_errors = false

# trading_bot/scanner.py was migrated from the legacy tradingbot.py in Phase 1.2.
# Strict typing of the indicator / detection / notification code is deferred —
# it's a major annotation effort and the math is already validated by 30 days of
# forward testing. New wiring added in 1.2 (log_signal, _load_secrets, main,
# _normalize_*) is annotated regardless. See CLAUDE.md "Deferred cleanup".
[[tool.mypy.overrides]]
module = "trading_bot.scanner"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=trading_bot --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
# scanner.py is omitted from coverage — see CLAUDE.md "Deferred cleanup".
# The indicator math, signal-detection rules, and live API wrappers are
# unchanged from the legacy tradingbot.py and intentionally not unit-tested
# in Phase 1.2 (spec §6: "Do not test the signal detection logic itself").
# The new wiring (log_signal, _load_secrets, main, _normalize_*) IS exercised
# in tests/test_scanner.py — it just doesn't count toward the percentage.
omit = ["trading_bot/scanner.py"]
